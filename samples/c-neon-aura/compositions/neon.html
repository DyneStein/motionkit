  <script>
    (function () {
      // music hits on the film clock (research/audio_hits.py) — quick events snap to them in tl.commit()
      const HITS = [0.104, 0.801, 1.579, 3.587, 5.248, 5.596, 6.153, 6.536, 7.245, 7.663, 8.533, 10.17, 10.53, 11.912, 13.026, 13.677, 14.164, 14.721, 15.128, 15.569, 16.834, 17.74, 18.355, 18.924, 19.365, 20.097, 20.503, 21.165, 21.502, 22.21, 23.069, 25.786, 26.424];
      const TL = gsap.timeline({ paused: true });
      const tl = beatSync(TL, HITS, { t0: 0 });
      // BEAT SYNC (MotionKit primitive 22) — make a scene's events land on the music without hand-retiming every tween.
      // Usage: const TL = gsap.timeline({ paused: true }); const tl = beatSync(TL, HITS, { t0: sceneStart });
      //        …author tweens on tl as usual (to / fromTo / set with a numeric position)…
      //        tl.commit(), then register TL (not tl) as the scene timeline.
      // HITS: strong audio hit times on the FILM clock (research/audio_hits.py). Quick tweens (≤ maxDur) are grouped into
      // clusters (starts within `gap` of each other); each cluster shifts as a block so its first start lands on the nearest
      // hit within ±tol. Staggers, order and long tweens (camera drivers, slow drifts) are untouched.
      function beatSync(TL, hits, opt) {
        opt = opt || {};

        const H = hits.map((h) => h - (opt.t0 || 0));
        const calls = [];
        const rec = {
          to: (...a) => (calls.push(["to", a]), rec),
          fromTo: (...a) => (calls.push(["fromTo", a]), rec),
          set: (...a) => (calls.push(["set", a]), rec),
          commit() {
            const info = calls.map(([m, a]) => {
              const pi = m === "fromTo" ? 3 : 2, vars = m === "fromTo" ? a[2] : a[1];
              return { m, a, pi, pos: a[pi], dur: m === "set" ? 0 : vars && vars.duration != null ? vars.duration : 0.5, shift: 0 };
            });

            const cl = [];

              const last = cl[cl.length - 1];

          },

      }

      // CAMERA RIG v3 (MotionKit primitive 15) — keyframed camera on a 3D world, a pure function of timeline time.
      // world: element with transform-style: preserve-3d inside a perspective lens.
      // KF: [{ t, x, y, z (dolly toward scene), rx, ry, rz (deg), f (focus depth), e }]
      //   e = GSAP ease name for the segment INTO this key (bell-shaped "power2.inOut"/"sine.inOut" for moves),
      //   or e = "glide": consecutive glide keys form ONE continuous monotone spline (no stops at inner keys) —
      //   use it to track a sentence word by word without stop-start hops; the run starts and ends at zero velocity.
      // dof: [{ el, z, max }] — leaf layers blurred by distance from the focus depth.
      // opt: { t0 (scene start on the film clock), drift (0–1), seed (int: per-film drift character), dofK, onRender(c, t) }
      function cameraRig(tl, world, D, KF, dof, opt) {
        opt = opt || {};
        const drift = opt.drift == null ? 1 : opt.drift;
        const keys = ["x", "y", "z", "rx", "ry", "rz", "f"];
        let prev = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0, f: 0 };
        const K = KF.slice().sort((a, b) => a.t - b.t).map((k) => (prev = Object.assign({}, prev, { e: "power2.inOut" }, k)));
        const E = {}, ez = (n) => E[n] || (E[n] = gsap.parseEase(n));
        // monotone cubic tangents (Fritsch–Butland) for glide runs; zero at run ends => smooth start/stop
        const M = {};
        keys.forEach((k) => {
          const m = K.map(() => 0);
          for (let i = 1; i < K.length - 1; i++) {
            if (K[i].e !== "glide" || K[i + 1].e !== "glide") continue;
            const h0 = K[i].t - K[i - 1].t, h1 = K[i + 1].t - K[i].t;
            const d0 = (K[i][k] - K[i - 1][k]) / h0, d1 = (K[i + 1][k] - K[i][k]) / h1;
            if (d0 * d1 > 0) m[i] = (3 * (h0 + h1)) / ((2 * h1 + h0) / d0 + (h1 + 2 * h0) / d1);
          }
          M[k] = m;
        });
        // seeded drift: each film gets its own frequencies, phases and amplitudes (no repeated, predictable sway)
        let s = (opt.seed || 1) >>> 0;
        const rnd = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const osc = () => ({ f: 0.035 + rnd() * 0.12, p: rnd() * 6.283, a: 0.6 + rnd() * 0.8 });
        const DR = { x: [osc(), osc()], y: [osc(), osc()], rz: [osc()], rx: [osc()] };
        const T0 = opt.t0 || 0;
        const sway = (ch, t, amp) => DR[ch].reduce((v, o, j) => v + amp[j] * o.a * Math.sin(6.283 * o.f * (t + T0) + o.p), 0);
        function render(t) {
          let i = 0;
          while (i < K.length - 1 && K[i + 1].t <= t) i++;
          const j = Math.min(i + 1, K.length - 1), a = K[i], b = K[j];
          const h = b.t - a.t, u = h > 0 ? Math.min(1, Math.max(0, (t - a.t) / h)) : 1;
          const c = {};
          keys.forEach((k) => {
            if (b.e === "glide" && h > 0) {
              const u2 = u * u, u3 = u2 * u;
              c[k] = (2 * u3 - 3 * u2 + 1) * a[k] + (u3 - 2 * u2 + u) * h * M[k][i] + (-2 * u3 + 3 * u2) * b[k] + (u3 - u2) * h * M[k][j];
            } else c[k] = a[k] + (b[k] - a[k]) * (h > 0 ? ez(b.e)(u) : 1);
          });
          c.x += drift * sway("x", t, [6, 2.5]);
          c.y += drift * sway("y", t, [4.5, 2]);
          c.rz += drift * sway("rz", t, [0.2]);
          c.rx += drift * sway("rx", t, [0.22]);
          world.style.transform = "translate3d(" + (-c.x).toFixed(2) + "px," + (-c.y).toFixed(2) + "px," + c.z.toFixed(2) + "px) rotateX(" +
            c.rx.toFixed(3) + "deg) rotateY(" + c.ry.toFixed(3) + "deg) rotateZ(" + c.rz.toFixed(3) + "deg)";
          (dof || []).forEach((d) => {
            const bl = Math.min(d.max || 8, Math.abs(d.z - c.f) * (opt.dofK || 0.022));
            d.el.style.filter = bl < 0.3 ? "none" : "blur(" + bl.toFixed(2) + "px)";
          });
          if (opt.onRender) opt.onRender(c, t);
        }
        const drv = { t: 0 };
        tl.fromTo(drv, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);
      }
      // seeded helper for motivated moves: varied direction/size so no two films (or beats) move the same way
      function camSeed(seed) {
        let s = seed >>> 0;
        const r = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        return { r, range: (a, b) => a + (b - a) * r(), sign: () => (r() < 0.5 ? -1 : 1), pick: (arr) => arr[Math.floor(r() * arr.length)] };
      }
      const CX = 540, CY = 800;
      function spin(sel, t0, d, turns) { tl.fromTo(sel, { "--a": "0deg" }, { "--a": 360 * turns + "deg", duration: d, ease: "none" }, t0); }
      function cap(id, tin, tout) {
        document.querySelectorAll(id + " span").forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, tin + i * 0.08);
          tl.to(w, { opacity: 0, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, tout + i * 0.035);
        });
      }
      tl.fromTo("#ne-haze", { z: -420, scale: 1.1, rotation: 0 }, { z: -420, scale: 1.45, rotation: 40, duration: 27, ease: "sine.inOut" }, 0);

      // 0 · hook: the loud pill is already glowing at frame 0
      spin("#ne-pill", 0, 3.4, 1.4);
      tl.fromTo("#ne-pill", { scale: 0.92, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
      cap("#ne-c0", 0.5, 4.6);

      // 1 · the pill shatters into meeting chips that crowd the frame
      tl.to("#ne-pill", { scale: 0.5, opacity: 0, duration: 0.35, ease: "power3.in" }, 2.95);
      const CHZ = [-260, 140, -110, 230, -30];
      const chipTo = [[-170, -390, -7], [190, -240, 5], [-200, -90, 4], [170, 60, -6], [-140, 205, 3]];
      chipTo.forEach((c, i) => {
        const s = "#ne-ch" + i;
        spin(s, 2.9, 2.6, 1 + i * 0.2);
        tl.fromTo(s, { x: 0, y: 0, z: 0, rotation: 0, scale: 0.4, opacity: 0 }, { x: c[0], y: c[1], z: CHZ[i], rotation: c[2], scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 3.05 + i * 0.07);
        tl.to(s, { x: c[0] + (i % 2 ? 14 : -14), y: c[1] + (i % 3 ? -10 : 12), rotation: -c[2] * 0.6, duration: 1.2, ease: "sine.inOut" }, 3.8);

      tl.fromTo("#ne-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 5.28);

      // 2 · the line starts to listen: it becomes a multi-colour voice wave
      const W = [0, 1, 2, 3].map((i) => document.getElementById("ne-w" + i));
      const wv = { t: 0, a: 0 };
      const K = [0.021, 0.017, 0.026, 0.013], SP = [3.1, -2.4, 4.0, -1.7], PH = [0, 1.4, 2.6, 4.1], AM = [1, 0.8, 0.62, 0.9];

        for (let i = 0; i < 4; i++) {

      tl.to(wv, { a: 0.0, duration: 0.7, ease: "power2.in", onUpdate: drawWave }, 8.9);

      tl.fromTo(".ne-o", { attr: { fill: "none", stroke: "#3c3c46", "stroke-width": 3 }, opacity: 0, scale: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)", stagger: 0.06 }, 9.35);
      const hot = [[540, 570], [702.6, 637.4], [770, 800], [702.6, 962.6]];
      tl.fromTo("#ne-hot", { opacity: 0, attr: { cx: 540, cy: 570 } }, { opacity: 1, duration: 0.3 }, 9.95);
      hot.forEach((p, i) => { if (i) tl.to("#ne-hot", { attr: { cx: p[0], cy: p[1] }, duration: 0.45, ease: "power3.inOut" }, 9.95 + i * 0.55); });
      cap("#ne-c2", 9.6, 11.55);

      // 4 · onset 11.95: the hours collapse into a neon eye; the iris draws; the pupil is a pill
      tl.to(".ne-o", { attr: { cx: CX, cy: CY }, opacity: 0, duration: 0.5, ease: "power3.in", stagger: 0.02 }, 11.6);

      const lid = { o: 0 }, L0 = document.getElementById("ne-lid0"), L1 = document.getElementById("ne-lid1");

      tl.to(lid, { o: 1, duration: 0.45, ease: "expo.out", onUpdate: drawEye }, 14.9);
      tl.fromTo("#ne-iris", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 12.3);
      tl.to("#ne-iris", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 12.3);
      tl.fromTo("#ne-iris", { rotation: 0, svgOrigin: "540 800" }, { rotation: 120, svgOrigin: "540 800", duration: 4.5, ease: "none" }, 12.3);

      spin("#ne-pupil", 12.75, 4.3, 2);
      cap("#ne-c3", 13.0, 16.4);

      // 5 · onset 16.86: the pupil opens into the whole day — the calendar card
      tl.to(["#ne-eye", "#ne-iris"], { opacity: 0, scale: 1.3, svgOrigin: "540 800", duration: 0.45, ease: "power3.in" }, 16.6);
      tl.set("#ne-pupil", { opacity: 0 }, 16.86);

      const CARD = ["#ne-cg", "#ne-cr"];
      tl.fromTo("#ne-cardsvg", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 16.85);
      tl.fromTo(CARD, { attr: { x: 410, y: 752, width: 260, height: 96, rx: 48 } },
        { attr: { x: 150, y: 350, width: 780, height: 900, rx: 60 }, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 16.86);
      const rimg = document.getElementById("ne-rimg"), rg = { a: 0 };

      tl.fromTo(rg, { a: 0 }, { a: 560, duration: 6.2, ease: "none", onUpdate: rimRot }, 16.86);
      tl.set("#ne-card", { opacity: 1 }, 16.86);

      ["#ne-r0", "#ne-r1", "#ne-r2", "#ne-r3"].forEach((r, i) => {

      });

      tl.set(["#ne-cardsvg", "#ne-card"], { opacity: 0 }, 21.06);
      tl.fromTo("#ne-bar", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 21.0);
      tl.to("#ne-bar", { scaleX: 0.01, duration: 1.1, ease: "power3.inOut" }, 21.6);
      tl.to("#ne-bar", { opacity: 0, duration: 0.1 }, 22.65);
      tl.fromTo("#ne-star", { opacity: 0, scale: 0.1, rotation: -45 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, 22.6);
      tl.to("#ne-star", { scale: 0.18, opacity: 0, rotation: 45, duration: 0.45, ease: "power3.in" }, 23.1);

      // 7 · the star opens into the brand pill
      tl.fromTo("#ne-logo", { z: -330, scale: 0.2, opacity: 0, filter: "blur(14px)" }, { z: -330, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 23.35);
      spin("#ne-logo", 23.35, 3.65, 1.1);
      tl.fromTo("#ne-tag", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 24.1);

      // ── camera: one seek-safe driver; dwell on each idea, sweep between them
      // ── camera: element-driven film => near-locked camera; every move is motivated by an event on screen. Seeded per film.
      const cs = camSeed(5521), side = cs.sign();
      cameraRig(tl, document.getElementById("ne-cam"), 27, [
        { t: 0, z: -120, rx: 6, y: 20 },
        { t: 2.6, z: 0, rx: 0, y: 0, e: "sine.inOut" },                                           // settle onto the loud pill
        { t: 3.1, z: 0, e: "power1.inOut" },
        { t: 4.6, z: -cs.range(50, 75), ry: side * cs.range(4, 7), e: "power2.inOut" },           // chips scatter: give them room
        { t: 5.4, z: 10, ry: 0, e: "power2.inOut" },                                              // the crowd presses into one line
        { t: 8.9, z: 30, x: side * cs.range(8, 16), e: "sine.inOut" },
        { t: 10.1, z: 0, x: 0, rx: cs.range(14, 20), e: "power2.inOut" },                         // read the ring of hours as a dial
        { t: 11.5, rx: cs.range(10, 14), rz: -side * cs.range(2, 4), e: "sine.inOut" },
        { t: 12.4, rx: 0, rz: 0, z: 0, e: "power2.inOut" },
        { t: 16.5, z: cs.range(70, 95), e: "sine.inOut" },                                         // slow push into the eye
        { t: 17.5, z: -45, e: "power2.inOut" },                                                    // pull back: the card fills the frame
        { t: 20.3, z: -25, ry: -side * cs.range(4, 7), e: "sine.inOut" },
        { t: 21.1, z: 0, ry: 0, e: "power2.inOut" },
        { t: 22.6, z: 40, e: "sine.inOut" },
        { t: 23.2, z: 260, e: "power3.in" },                                                       // dive through the star into the logo
        { t: 27, z: 320, e: "expo.out" },
