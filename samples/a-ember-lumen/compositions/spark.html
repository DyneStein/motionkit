      const tl = beatSync(TL, HITS, { t0: 0, tol: 0.32 });

      // Usage: const TL = gsap.timeline({ paused: true }); const tl = beatSync(TL, HITS, { t0: sceneStart });
      //        …author tweens on tl as usual (to / fromTo / set with a numeric position)…
      //        tl.commit(), then register TL (not tl) as the scene timeline.
      // HITS: strong audio hit times on the FILM clock (research/audio_hits.py). Quick tweens (≤ maxDur) are grouped into
      // clusters (starts within `gap` of each other); each cluster shifts as a block so its first start lands on the nearest
      // hit within ±tol. Staggers, order and long tweens (camera drivers, slow drifts) are untouched.
      function beatSync(TL, hits, opt) {
        opt = opt || {};
        const tol = opt.tol == null ? 0.2 : opt.tol, maxDur = opt.maxDur == null ? 1.0 : opt.maxDur, gap = opt.gap == null ? 0.18 : opt.gap;
        const H = hits.map((h) => h - (opt.t0 || 0));
        const calls = [];
        const rec = {
          to: (...a) => (calls.push(["to", a]), rec),
          fromTo: (...a) => (calls.push(["fromTo", a]), rec),
          set: (...a) => (calls.push(["set", a]), rec),
          commit() {
            const info = calls.map(([m, a]) => {
              const pi = m === "fromTo" ? 3 : 2, vars = m === "fromTo" ? a[2] : a[1];
              return { m, a, pi, pos: a[pi], dur: m === "set" ? 0 : vars && vars.duration != null ? vars.duration : 0.5, shift: 0 };
            });
            const ev = info.filter((c) => typeof c.pos === "number" && c.dur <= maxDur && c.pos > 0.05).sort((x, y) => x.pos - y.pos);
            const cl = [];
            ev.forEach((c) => {
              const last = cl[cl.length - 1];
              if (last && c.pos - last.end <= gap) { last.items.push(c); last.end = Math.max(last.end, c.pos); }
              else cl.push({ start: c.pos, end: c.pos, items: [c] });

              prevNew = k.start + d;
            });

          },

          let i = 0;
          while (i < K.length - 1 && K[i + 1].t <= t) i++;
          const j = Math.min(i + 1, K.length - 1), a = K[i], b = K[j];
          const h = b.t - a.t, u = h > 0 ? Math.min(1, Math.max(0, (t - a.t) / h)) : 1;
          const c = {};
          keys.forEach((k) => {
            if (b.e === "glide" && h > 0) {
              const u2 = u * u, u3 = u2 * u;
              c[k] = (2 * u3 - 3 * u2 + 1) * a[k] + (u3 - 2 * u2 + u) * h * M[k][i] + (-2 * u3 + 3 * u2) * b[k] + (u3 - u2) * h * M[k][j];
            } else c[k] = a[k] + (b[k] - a[k]) * (h > 0 ? ez(b.e)(u) : 1);
          });
          c.x += drift * sway("x", t, [6, 2.5]);
          c.y += drift * sway("y", t, [4.5, 2]);
          c.rz += drift * sway("rz", t, [0.2]);
          c.rx += drift * sway("rx", t, [0.22]);
          world.style.transform = "translate3d(" + (-c.x).toFixed(2) + "px," + (-c.y).toFixed(2) + "px," + c.z.toFixed(2) + "px) rotateX(" +
            c.rx.toFixed(3) + "deg) rotateY(" + c.ry.toFixed(3) + "deg) rotateZ(" + c.rz.toFixed(3) + "deg)";
          (dof || []).forEach((d) => {
            const bl = Math.min(d.max || 8, Math.abs(d.z - c.f) * (opt.dofK || 0.022));
            d.el.style.filter = bl < 0.3 ? "none" : "blur(" + bl.toFixed(2) + "px)";
          });
          if (opt.onRender) opt.onRender(c, t);
        }
        const drv = { t: 0 };
        tl.fromTo(drv, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);
      }
      // seeded helper for motivated moves: varied direction/size so no two films (or beats) move the same way
      function camSeed(seed) {
        let s = seed >>> 0;
        const r = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        return { r, range: (a, b) => a + (b - a) * r(), sign: () => (r() < 0.5 ? -1 : 1), pick: (arr) => arr[Math.floor(r() * arr.length)] };
      }

      const CX = 540, CY = 800;
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rand = rng(52);

      // words arrive blurred, one by one, no translate; leave blurred
      function caption(sel, tin, tout, scatter) {
        const words = document.querySelectorAll(sel + " span");
        tl.set(sel, { opacity: 1 }, 0);
        words.forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power2.out" }, tin + i * 0.09);
          const out = scatter ? { x: (rand() - 0.5) * 220, y: (rand() - 0.5) * 120, rotation: (rand() - 0.5) * 18 } : {};
          tl.to(w, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.28, ease: "power2.in" }, out), tout + i * 0.04);
        });
      }

      // --- 0 · ember is already in frame (hook), then falls and lands on the 1.0 s onset
      tl.fromTo("#sp-ember", { y: -470 }, { y: 0, duration: 0.82, ease: "power2.in" }, 0.15);
      tl.fromTo("#sp-ember", { scaleX: 1, scaleY: 1 }, { scaleX: 1.5, scaleY: 0.62, duration: 0.06, ease: "power1.out" }, 0.97);
      tl.to("#sp-ember", { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.55)" }, 1.03);
      ["#sp-r0", "#sp-r1", "#sp-r2", "#sp-r3"].forEach((r, i) => {
        tl.fromTo(r, { attr: { rx: 10, ry: 2 }, opacity: 0.7 }, { attr: { rx: 470 - i * 70, ry: (470 - i * 70) * 0.17 }, opacity: 0, duration: 2.3, ease: "power2.out" }, 0.98 + i * 0.2);
      });
      for (let i = 0; i < 6; i++) {
        const dx = (i - 2.5) * 46 + (rand() - 0.5) * 20, h = 70 + rand() * 90;
        tl.fromTo("#sp-d" + i, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.97);
        tl.fromTo("#sp-d" + i, { attr: { cx: 540, cy: 806 } }, { attr: { cx: 540 + dx }, duration: 0.75, ease: "none" }, 0.98);
        tl.to("#sp-d" + i, { attr: { cy: 806 - h }, duration: 0.33, ease: "power2.out" }, 0.98);
        tl.to("#sp-d" + i, { attr: { cy: 812 }, opacity: 0, duration: 0.42, ease: "power2.in" }, 1.31);
      }

      // --- swell into a sun with a lens flare and a reflection on the dark floor
      tl.fromTo("#sp-ember", { scale: 1 }, { scale: 3.2, y: -70, opacity: 0, duration: 0.75, ease: "power2.in" }, 1.3);
      tl.fromTo("#sp-sun", { scale: 0.12, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "power3.out", immediateRender: true }, 1.55);
      tl.fromTo("#sp-refl", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 1.5, ease: "power2.out" }, 1.5);
      tl.fromTo("#sp-flare", { opacity: 0, scaleX: 0 }, { opacity: 0.6, scaleX: 1, duration: 0.8, ease: "expo.out" }, 2.05);
      tl.to("#sp-flare", { opacity: 0, duration: 0.5, ease: "power2.in" }, 3.1);
      caption("#sp-c1", 1.5, 3.4, false);
      tl.to("#sp-sun", { scale: 0.1, opacity: 0, duration: 0.55, ease: "power3.in" }, 3.4);
      tl.fromTo("#sp-ember", { scale: 3.2, y: -70, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.in", immediateRender: false }, 3.4);
      tl.to("#sp-refl", { opacity: 0, scaleX: 0.2, duration: 0.5, ease: "power3.in" }, 3.4);

      // --- burst: one spark becomes many thoughts drifting apart
      const ring = [];
      for (let i = 0; i < 16; i++) {
        const a = rand() * Math.PI * 2, r = 150 + rand() * 300;
        const sx = Math.cos(a) * r, sy = Math.sin(a) * r * 1.25;
        const ra = (i / 16) * Math.PI * 2 - Math.PI / 2;
        ring.push([Math.cos(ra) * 230, Math.sin(ra) * 230]);
        const p = "#sp-p" + i, sc = 0.6 + rand() * 0.9, pz = -380 + rand() * 640, pb = Math.min(5, Math.abs(pz) * 0.012);
        tl.fromTo(p, { x: 0, y: 0, z: 0, scale: 0, opacity: 0, filter: "blur(0px)" }, { x: sx, y: sy, z: pz, scale: sc, opacity: 1, filter: "blur(" + pb.toFixed(1) + "px)", duration: 0.95, ease: "expo.out" }, 3.95 + i * 0.012);
        tl.to(p, { x: sx + (rand() - 0.5) * 70, y: sy + (rand() - 0.5) * 70, duration: 2.1, ease: "sine.inOut" }, 4.9);
        // pulled into orbit, back onto one plane
        tl.to(p, { x: ring[i][0], y: ring[i][1], z: 0, filter: "blur(0px)", scale: 0.85, duration: 1.3, ease: "power3.inOut" }, 7.0 + i * 0.025);
        tl.to(p, { scale: 0, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.75 + i * 0.01);
      }
      tl.to("#sp-ember", { scale: 0.55, opacity: 0.55, duration: 0.6, ease: "power2.out" }, 3.95);
      tl.to("#sp-ember", { scale: 0, opacity: 0, duration: 0.5, ease: "power2.in" }, 7.1);
      caption("#sp-c2", 4.35, 6.75, true);
      tl.fromTo("#sp-orbit", { rotation: 0 }, { rotation: 140, duration: 5.6, ease: "none" }, 3.95);
      tl.to("#sp-ring", { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "power2.inOut" }, 7.5);
      caption("#sp-c3", 7.6, 10.05, false);

      // --- the ring melts: wobbling blob, then condenses into a glowing disc (one driver, seek-safe)
      const blob = document.getElementById("sp-blob");
      const drv = { u: 0 };
      function blobPath(R, amp, ph) {
        let d = "";
        for (let i = 0; i <= 96; i++) {
          const a = (i / 96) * Math.PI * 2;
          const r = R * (1 + amp * Math.sin(5 * a + ph) + amp * 0.45 * Math.sin(7 * a - ph * 1.4));
          d += (i ? "L" : "M") + (CX + r * Math.cos(a)).toFixed(1) + "," + (CY + r * Math.sin(a)).toFixed(1);
        }
        return d + "Z";
      }
      function drawBlob() {
        const u = drv.u;
        const grow = Math.min(1, u / 0.35), shrink = Math.max(0, (u - 0.45) / 0.55);
        const e = (x) => x * x * (3 - 2 * x);
        const amp = 0.13 * e(grow) * (1 - e(shrink));
        const R = 230 - 170 * e(shrink);
        blob.setAttribute("d", blobPath(R, amp, u * 7));
        blob.setAttribute("fill-opacity", (0.15 * e(grow) + 0.85 * e(shrink)).toFixed(3));
        blob.style.opacity = u <= 0 ? 0 : 1;
      }
      tl.fromTo(drv, { u: 0 }, { u: 1, duration: 1.75, ease: "none", onUpdate: drawBlob }, 8.5);
      tl.to("#sp-ring", { opacity: 0, duration: 0.3, ease: "power1.out" }, 8.6);

      // --- disc becomes the pill on the 10.5 s onset
      tl.fromTo("#sp-pill", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 10.2);
      tl.to("#sp-blob", { opacity: 0, duration: 0.15, ease: "none" }, 10.3);
      tl.fromTo(["#sp-pr", "#sp-ps", "#sp-pc"], { attr: { x: 480, width: 120 } }, { attr: { x: 260, width: 560 }, duration: 0.6, ease: "power3.out" }, 10.4);
      tl.fromTo("#sp-sheen", { attr: { x: 100 } }, { attr: { x: 860 }, duration: 0.9, ease: "power2.inOut" }, 10.75);

      // element-driven: the camera only follows what moves (the falling ember) and breathes with the reveals. Seeded per film.
      const cs = camSeed(3301), side = cs.sign();
      cameraRig(tl, document.getElementById("sp-world"), 11.6, [
        { t: 0, y: -210, rx: -3, z: -30 },
        { t: 1.05, y: 0, rx: 6, z: 0, e: "power2.inOut" },                              // follow the ember down to the surface
        { t: 3.35, z: cs.range(60, 85), rx: 3, e: "sine.inOut" },                        // slow push on the sun
        { t: 4.3, z: -cs.range(70, 95), rx: 0, ry: side * cs.range(3, 5), e: "power2.inOut" }, // the sparks scatter: give them room
        { t: 6.9, z: -cs.range(80, 100), ry: side * cs.range(1, 2), e: "sine.inOut" },
        { t: 8.4, z: 10, ry: 0, e: "power2.inOut" },                                    // they gather: lean in
        { t: 10.3, z: 40, rz: -side * 1.2, e: "sine.inOut" },
        { t: 11.6, z: 0, rx: 8, rz: 0, e: "power2.inOut" },
      ], null, { t0: 0, drift: 0.35, seed: 3301 });
      drawBlob();
      tl.commit();
      window.__timelines["spark"] = TL;
    })();
  </script>
</template>
