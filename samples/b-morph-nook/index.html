<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-canvas","type":"color","label":"Canvas","default":"#E8E3EF"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#1D1D1F"},
    {"id":"color-warm","type":"color","label":"Warm accent","default":"#FF6B57"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --color-canvas: #e8e3ef; --color-ink: #1d1d1f; --color-warm: #ff6b57; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--color-canvas); }
      body { font-family: "Inter", sans-serif; }
      #canvas { position: absolute; inset: 0; background: var(--color-canvas); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-motion-blur="on" data-motion-blur-events="on" data-width="1080" data-height="1920">
      <div id="canvas"></div>
      <svg id="grain" width="1080" height="1920" style="position:absolute;inset:0;z-index:3;opacity:0.05;mix-blend-mode:soft-light;pointer-events:none" data-layout-ignore><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" /><feColorMatrix type="saturate" values="0" /></filter><rect width="100%" height="100%" filter="url(#gr)" /></svg>
      <div id="morph" class="clip" data-composition-id="morph" data-composition-src="compositions/morph.html"
        data-start="0" data-duration="26" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="26"
        data-track-index="2" data-volume="1" data-fade-in="0.3" data-fade-out="1.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
