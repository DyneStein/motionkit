      function cameraRig(tl, world, D, KF, dof, opt) {

          const m = K.map(() => 0);
          for (let i = 1; i < K.length - 1; i++) {
            if (K[i].e !== "glide" || K[i + 1].e !== "glide") continue;
            const h0 = K[i].t - K[i - 1].t, h1 = K[i + 1].t - K[i].t;
            const d0 = (K[i][k] - K[i - 1][k]) / h0, d1 = (K[i + 1][k] - K[i][k]) / h1;
            if (d0 * d1 > 0) m[i] = (3 * (h0 + h1)) / ((2 * h1 + h0) / d0 + (h1 + 2 * h0) / d1);
          }

        });
        // seeded drift: each film gets its own frequencies, phases and amplitudes (no repeated, predictable sway)
        let s = (opt.seed || 1) >>> 0;
        const rnd = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

        function render(t) {

          while (i < K.length - 1 && K[i + 1].t <= t) i++;

          const c = {};

            c.rx.toFixed(3) + "deg) rotateY(" + c.ry.toFixed(3) + "deg) rotateZ(" + c.rz.toFixed(3) + "deg)";

        render(0);
      }
      // seeded helper for motivated moves: varied direction/size so no two films (or beats) move the same way
      function camSeed(seed) {
        let s = seed >>> 0;
        const r = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        return { r, range: (a, b) => a + (b - a) * r(), sign: () => (r() < 0.5 ? -1 : 1), pick: (arr) => arr[Math.floor(r() * arr.length)] };
      }
      const beat = (n) => +(0.11 + 0.6 * n).toFixed(3);
      const bar = (k) => beat(2 + 4 * k);
      const $ = (s) => document.querySelector(s);

      // layout position of an element inside the world plane (offset chain, unaffected by transforms)

      const K = [];
      const key = (t, o, e) => K.push(Object.assign({ t, e: e || "power2.inOut" }, o));
      const AX = 1240; // follow anchor: newest word's right edge sits at 65 % of frame width

      function sentence(sel, times, cy, opt) {

            key(times[i] + (opt.hop || 0.42), { x, y: cy, z: 0 }, "glide"); // one continuous spline through every word target
          }

        // ── R6 · CAMERA beat: glide RIGHT with "While you get on with life.", then settle DOWN onto the toasts
        sentence("#s6", [18.25, 18.5, 18.75, 19.0, 19.25, 19.6], -2620 - 400, { hop: 0.55 });
        ["#t1", "#t2", "#t3"].forEach((t, i) => tl.fromTo(t, { opacity: 0, y: 60, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 19.0 + i * 0.3));
        key(21.0, { x: 1000 - 960, y: -2200 - 540, z: -60, rx: 0 }, "power2.inOut");

        key(21.35, {});
        key(bar(8) + 0.7, { x: SL.x + SL.w / 2 - 960, y: SL.y + 110 - 540, z: -10, rx: 0, ry: 0 }, "power2.inOut");
        { const m = document.createElement("span"); m.textContent = "handled."; m.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:600 168px/220px Chillax;letter-spacing:-0.045em";

        // resolve relative "+0" keys (hold position, used for slow dwell drift) and run the camera

        K.forEach((k) => { if (k.x === "+0") { k.x = last ? last.x + 40 : 0; } if (k.x != null && typeof k.x === "number") last = k; });
        K.sort((a, b) => a.t - b.t);

        tl.set(["#cur", "#hub", ".gbtn", "#logo", "#tag", "#cta", "#area", "#slotA", "#win"], { opacity: 0 }, 0);
        window.__timelines["saas"] = tl;
      });
